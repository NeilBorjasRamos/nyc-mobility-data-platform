[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-lakehouse"
version = "0.2.0"
description = "Reproducible NYC TLC batch platform with quality gates and transactional publication"
readme = "README.md"
license = "MIT"
authors = [{name = "Neil Borjas Ramos"}]
keywords = ["data-engineering", "etl", "duckdb", "parquet", "data-quality"]
requires-python = ">=3.11,<3.14"
dependencies = ["duckdb==1.4.3", "requests==2.32.5", "pytz==2026.5"]

[project.optional-dependencies]
analysis = ["matplotlib==3.10.8"]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1", "ruff==0.14.2", "build==1.3.0"]

[project.urls]
Repository = "https://github.com/NeilBorjasRamos/nyc-mobility-data-platform"
Documentation = "https://github.com/NeilBorjasRamos/nyc-mobility-data-platform/tree/main/docs"

[project.scripts]
taxi = "taxi_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
taxi_lakehouse = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["taxi_lakehouse"]

[tool.coverage.report]
show_missing = true
